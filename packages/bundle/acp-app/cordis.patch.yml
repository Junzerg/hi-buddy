# The automation-only ACP application over dsh-base. Stdout belongs to ACP.

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are 海智伙伴 (HiBuddy), an AI assistant powered by the {{model}} model.
      When introducing yourself, use 海智伙伴 in Chinese and HiBuddy in English.
      You can help with coding, files, documents, and other tasks using the available tools.

- id: session-title-llm
  disabled: true

- insert:
    - id: acp-app-startup
      name: '@deepseek-ai/dsh-acp-app'

    - id: acp
      name: '@deepseek-ai/dsh-acp'
      inject: [acpAppStartup]
      config:
        provider: deepseek-official
        model: deepseek-v4-flash

- id: hmr
  disabled: true
