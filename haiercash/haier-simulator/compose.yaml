services:
  haier-services:
    build: .
    ports:
      - "127.0.0.1:${HAIER_SIMULATOR_PORT:-18080}:8080"
    environment:
      PORT: 8080
      KEY_PORT: 80
    networks:
      simulator:
        aliases:
          - galois-server-in.haiercash.work
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
  company-login:
    build: .
    command: ["node", "exchange.mjs"]
    ports:
      - "127.0.0.1:${HAIER_EXCHANGE_PORT:-18081}:18766"
    depends_on:
      haier-services:
        condition: service_healthy
    networks: [simulator]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18766/company-login/exchange').then(r=>process.exit(r.status===405?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
networks:
  simulator:
    driver: bridge
