# 文档库按「工作区 → 会话 → 文档」组织：
#   - 工作区、会话、会话标题都来自宿主自己的 workspaceRegistry / sessionQuery；
#   - 每个会话下的文档 = 该会话里用户上传的附件 + 该会话 write/edit 写出的文件。
# 下面这个 root 只在两种情况下用到：
#   - 宿主没有会话/工作区服务时，退化为原来的扁平目录索引；
#   - 作为「本地文档目录」分组，收纳 root 里不属于任何会话的文件。
- insert:
    - id: doclib
      name: '@local/dsh-plugin-doclib'
      config:
        root: docs
